{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-4"><h2>Candidate Ranking</h2><form><select class="form-select" name="job_id" onchange="this.form.submit()"><option value="">All Jobs</option>{% for j in jobs %}<option value="{{j.id}}" {% if selected==j.id %}selected{% endif %}>{{j.title}}</option>{% endfor %}</select></form></div><div class="card table-responsive"><table class="table align-middle mb-0"><tr><th>Rank</th><th>Candidate</th><th>Job</th><th>Score</th><th>Recommendation</th><th></th></tr>{% for r in results %}<tr><td>{{loop.index}}</td><td>{{r.resume.candidate_name}}</td><td>{{r.job.title}}</td><td><b>{{r.final_score}}%</b></td><td><span class="badge text-bg-primary">{{r.recommendation}}</span></td><td><a href="{{url_for('screening_result',id=r.id)}}">View</a></td></tr>{% else %}<tr><td colspan="6" class="text-center p-4">No screening results yet.</td></tr>{% endfor %}</table></div>{% endblock %}
