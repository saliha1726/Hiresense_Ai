{% extends "base.html" %}{% block content %}<h2 class="mb-4">{{"Edit Job" if job else "Create Job"}}</h2><form method="post" class="card"><div class="card-body"><div class="row g-3">{% for name,label in [('title','Job Title'),('department','Department'),('location','Location'),('employment_type','Employment Type'),('experience_required','Experience Required')] %}<div class="col-md-6"><label>{{label}}</label><input class="form-control" name="{{name}}" value="{{job|attr(name) if job else ''}}" required></div>{% endfor %}<div class="col-12"><label>Description</label><textarea class="form-control" name="description" rows="4" required>{{job.description if job else ''}}</textarea></div><div class="col-md-6"><label>Required Skills (comma separated)</label><textarea class="form-control" name="required_skills" rows="3" required>{{job.required_skills if job else ''}}</textarea></div><div class="col-md-6"><label>Preferred Skills</label><textarea class="form-control" name="preferred_skills" rows="3">{{job.preferred_skills if job else ''}}</textarea></div></div><button class="btn btn-primary mt-4">Save Job</button></div></form>{% endblock %}
