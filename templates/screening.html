{% extends "base.html" %}{% block content %}<h2>AI Screening</h2><p class="text-secondary">Transparent score: 60% text similarity + 30% skills + 10% experience.</p><form method="post" action="{{url_for('run_screening')}}" class="card mt-4"><div class="card-body"><label>Job</label><select class="form-select mb-3" name="job_id" required>{% for j in jobs %}<option value="{{j.id}}">{{j.title}}</option>{% endfor %}</select><label>Candidate Resume</label><select class="form-select mb-3" name="resume_id" required>{% for r in resumes %}<option value="{{r.id}}">{{r.candidate_name}} — {{r.filename}}</option>{% endfor %}</select><button class="btn btn-primary btn-lg">Screen Candidate</button></div></form>{% if not jobs or not resumes %}<div class="alert alert-info mt-3">Create a job and upload at least one resume first.</div>{% endif %}{% endblock %}
