{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-4"><h2>Jobs</h2><a class="btn btn-primary" href="{{url_for('create_job')}}">+ Create Job</a></div><div class="row g-3">{% for j in jobs %}<div class="col-md-6 col-xl-4"><div class="card h-100"><div class="card-body"><span class="badge text-bg-light">{{j.department}}</span><h5 class="mt-2">{{j.title}}</h5><p class="text-secondary">{{j.location}} · {{j.employment_type}}</p><p>{{j.description[:130]}}{% if j.description|length>130 %}...{% endif %}</p><a class="btn btn-sm btn-outline-primary" href="{{url_for('job_detail',id=j.id)}}">View</a> <a class="btn btn-sm btn-outline-secondary" href="{{url_for('edit_job',id=j.id)}}">Edit</a></div></div></div>{% else %}<div class="col-12"><div class="empty">No jobs yet.</div></div>{% endfor %}</div>{% endblock %}
