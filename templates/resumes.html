{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-4"><h2>Resumes</h2><a class="btn btn-primary" href="{{url_for('upload_resume')}}">Upload Resume</a></div><div class="table-responsive card"><table class="table table-hover mb-0"><tr><th>Candidate</th><th>Email</th><th>Skills</th><th>Uploaded</th><th></th></tr>{% for r in resumes %}<tr><td>{{r.candidate_name}}</td><td>{{r.email}}</td><td>{{r.skills[:90]}}</td><td>{{r.uploaded_at.strftime('%d %b %Y')}}</td><td><a href="{{url_for('resume_detail',id=r.id)}}">View</a></td></tr>{% else %}<tr><td colspan="5" class="text-center p-4">No resumes uploaded.</td></tr>{% endfor %}</table></div>{% endblock %}
