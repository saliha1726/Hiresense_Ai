{% extends "base.html" %}{% block content %}<h2>Analytics</h2><div class="row g-4 mt-1"><div class="col-lg-6"><div class="card"><div class="card-body"><h5>Recommendations</h5>{% if rec_labels %}<canvas id="recChart"></canvas>{% else %}<p class="text-secondary">No screening data yet.</p>{% endif %}</div></div></div><div class="col-lg-6"><div class="card"><div class="card-body"><h5>Average Score by Job</h5>{% if job_labels %}<canvas id="jobChart"></canvas>{% else %}<p class="text-secondary">No screening data yet.</p>{% endif %}</div></div></div></div><script>new Chart(document.getElementById('recChart'),{type:'doughnut',data:{labels:{{rec_labels|tojson}},datasets:[{data:{{rec_counts|tojson}}}]}});new Chart(document.getElementById('jobChart'),{type:'bar',data:{labels:{{job_labels|tojson}},datasets:[{label:'Average score %',data:{{job_scores|tojson}}}]},options:{scales:{y:{beginAtZero:true,max:100}}}});</script>{% endblock %}
